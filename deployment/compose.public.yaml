# docker compose -f compose.yaml -f deployment/compose.public.yaml up -d --build
# Requires a public DNS record and inbound 80/443. Local app port stays loopback-only.
services:
  app:
    environment:
      # Public overlay must not inherit the local .env template's optional-MFA 0.
      THREADGATE_REQUIRE_MFA: "1"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  proxy:
    image: caddy:2@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    ports:
      - "80:80"
      - "443:443"
    environment:
      THREADGATE_DOMAIN: ${THREADGATE_DOMAIN:?Set THREADGATE_DOMAIN to your real DNS hostname}
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  caddy_data:
  caddy_config:
